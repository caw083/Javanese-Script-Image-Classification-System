<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Lenz Aksara Jawa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100" style="background-image: url('static/background.jpg');  
background-size: cover; 
background-position: center; 
font-family: 'Noto Sans', sans-serif;
opacity: 0.9">
    <div class="max-w-3xl mx-auto py-10">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Google Lenz Aksara Jawa</h1>
        
        <form action="/upload" method="POST" enctype="multipart/form-data">
            <label for="image" class="block text-xl text-center font-medium text-gray-700 mb-4">Choose an image:</label>
            
            <!-- Image upload area -->
            <div class="max-w-md mx-auto rounded-lg overflow-hidden md:max-w-xl" id="hiddenWhenGetImage">
                <div class="md:flex">
                    <div class="w-full p-3">
                        <div
                            class="relative h-48 rounded-lg border-2 border-blue-500 bg-gray-50 flex justify-center items-center shadow-lg hover:shadow-xl transition-shadow duration-300 ease-in-out"
                        >
                            <!-- Image preview will be shown here after upload -->
                            <div class="absolute flex flex-col items-center">
                                <img
                                    alt="File Icon"
                                    class="mb-3"
                                    src="https://img.icons8.com/dusk/64/000000/file.png"
                                />
                                <span class="block text-gray-500 font-semibold">
                                    Drag &amp; drop your files here
                                </span>
                                <span class="block text-gray-400 font-normal mt-1">
                                    or click to upload
                                </span>
                            </div>

                            <!-- File input -->
                            <input
                                name="image"
                                id="image"
                                accept="image/*"
                                required
                                class="h-full w-full opacity-0 cursor-pointer"
                                type="file"
                                onchange="previewImage(event)"
                            />
                        </div>
                    </div>
                </div>
            </div>
              <!-- Image preview container -->
              <div id="imagePreview" class="w-full h-full flex justify-center items-center hidden">
                <img id="previewImg" class="w-full h-full object-cover rounded-lg" />
            </div>

              <!-- Buttons: Delete and Upload -->
<div id="deleteButtonContainer" class="hidden mt-4 flex justify-center space-x-4">
    <button
        type="button"
        id="deleteButton"
        class="py-2 px-6 bg-red-500 text-white rounded-lg hover:bg-red-600 transition duration-300 ease-in-out"
        onclick="deleteImage()"
    >
        Delete Image
    </button>
    
    <button
        type="submit"
        class="py-2 px-6 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition duration-300 ease-in-out"
    >
        Upload
    </button>
        </form>
    </div>

    <script>
        // JavaScript function to preview the image once selected and hide the upload area
        function previewImage(event) {
            const file = event.target.files[0];
            const imagePreview = document.getElementById('imagePreview');
            const previewImg = document.getElementById('previewImg');
            const uploadContainer = document.getElementById('hiddenWhenGetImage');
            const deleteButtonContainer = document.getElementById('deleteButtonContainer');
            
            // Check if file is an image
            if (file && file.type.startsWith('image')) {
                const reader = new FileReader();

                // Set the image source when the file is loaded
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    imagePreview.classList.remove('hidden');  // Show the image preview
                    uploadContainer.classList.add('hidden');  // Hide the upload area
                    deleteButtonContainer.classList.remove('hidden');  // Show delete button
                };

                // Read the image file as a data URL
                reader.readAsDataURL(file);
            } else {
                imagePreview.classList.add('hidden'); // Hide the preview if not an image
                uploadContainer.classList.remove('hidden');  // Show the upload area again
                deleteButtonContainer.classList.add('hidden');  // Hide the delete button
            }
        }

        // JavaScript function to delete the image preview and reset the input
        function deleteImage() {
            const imagePreview = document.getElementById('imagePreview');
            const previewImg = document.getElementById('previewImg');
            const uploadContainer = document.getElementById('hiddenWhenGetImage');
            const deleteButtonContainer = document.getElementById('deleteButtonContainer');
            const fileInput = document.getElementById('image');
            
            // Hide image preview and delete button
            imagePreview.classList.add('hidden');
            deleteButtonContainer.classList.add('hidden');
            
            // Show the upload container again
            uploadContainer.classList.remove('hidden');
            
            // Reset the file input
            fileInput.value = ''; // Clear the selected file
        }
   
    </script>
</body>
</html>
